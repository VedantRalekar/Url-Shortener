upstream url_shortener_backend {

    server ${PROJECT_NAME}-app-1:${PORT};
    server ${PROJECT_NAME}-app-2:${PORT};
    server ${PROJECT_NAME}-app-3:${PORT};
    server ${PROJECT_NAME}-app-4:${PORT};
    server ${PROJECT_NAME}-app-5:${PORT};
    server ${PROJECT_NAME}-app-6:${PORT};

}


server {

    listen ${NGINX_PORT};

    # PROXY ALL APPLICATION REQUESTS
    location / {

        proxy_pass http://url_shortener_backend;


        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        # HTTP/1.1
        proxy_http_version 1.1;


        # Connection handling
        proxy_set_header Connection "";


        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

    }

}